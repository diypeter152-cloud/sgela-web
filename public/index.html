<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sgela — Your Matric Tutor</title>
<meta name="description" content="Your personal Grade 12 tutor for Maths, Sciences and more. Sharp minds, better marks." />

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E0C1D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sgela" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0E0C1D;
    --bg-soft: #16132B;
    --surface: #1C1838;
    --surface-2: #231E44;
    --border: #2E2A4F;
    --text: #F3F1FB;
    --text-dim: #A9A4C7;
    --accent: #FFD23F;
    --accent-2: #8B7BFF;
    --accent-grad: linear-gradient(135deg, #8B7BFF 0%, #B57BFF 100%);
    --student-grad: linear-gradient(135deg, #6D5BFF 0%, #8B5BFF 100%);
    --radius: 22px;
    --maxw: 760px;
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1100px 500px at 80% -10%, rgba(139,123,255,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(255,210,63,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 15px 20px calc(15px) ;
    padding-top: calc(15px + env(safe-area-inset-top, 0));
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: rgba(14,12,29,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 11px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    font-family: Fraunces, serif; font-weight: 600; font-size: 19px;
    color: #15132B;
    box-shadow: 0 4px 16px rgba(139,123,255,0.4);
  }
  .brand { display: flex; flex-direction: column; line-height: 1.1; }
  .brand .name {
    font-weight: 700; font-size: 17px; letter-spacing: -0.01em;
  }
  .brand .tag { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
  .status {
    margin-left: auto; font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 6px; font-weight: 500;
  }
  .status .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #3DDC84;
    box-shadow: 0 0 0 0 rgba(61,220,132,0.5); animation: ring 2s infinite;
  }
  @keyframes ring { 0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)} 70%{box-shadow:0 0 0 7px rgba(61,220,132,0)} 100%{box-shadow:0 0 0 0 rgba(61,220,132,0)} }

  /* ---------- Thread ---------- */
  main { flex: 1; overflow-y: auto; padding: 22px 16px 10px; -webkit-overflow-scrolling: touch; }
  .thread { max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* ---------- Greeting ---------- */
  .greeting { margin: 7vh auto 0; max-width: 560px; padding: 0 6px; animation: rise .5s ease both; }
  .greeting .hi {
    font-family: Fraunces, serif; font-weight: 600;
    font-size: clamp(30px, 8vw, 44px); line-height: 1.05; letter-spacing: -0.02em;
    margin: 0 0 14px;
    background: linear-gradient(120deg, #FFFFFF 30%, #C9BFFF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .greeting p { color: var(--text-dim); font-size: 16px; line-height: 1.55; margin: 0 0 24px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 11px 16px; border-radius: 14px;
    font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: transform .08s, border-color .18s, background .18s;
  }
  .chip:hover { border-color: var(--accent-2); background: var(--surface-2); }
  .chip:active { transform: scale(.96); }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

  /* ---------- Messages ---------- */
  .msg { display: flex; gap: 11px; align-items: flex-start; animation: rise .32s ease both; }
  .msg.student { justify-content: flex-end; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; margin-top: 2px;
    background: var(--accent-grad); display: grid; place-items: center;
    font-family: Fraunces, serif; font-weight: 600; font-size: 15px; color: #15132B;
  }
  .bubble {
    max-width: 82%; padding: 13px 16px; font-size: 15.5px; line-height: 1.6;
    border-radius: var(--radius); word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.sgela .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-top-left-radius: 7px; color: var(--text);
  }
  .msg.student .bubble {
    background: var(--student-grad); color: #fff; border-top-right-radius: 7px;
    box-shadow: 0 6px 20px rgba(109,91,255,0.3);
  }
  .bubble p { margin: 0 0 9px; } .bubble p:last-child { margin: 0; }
  .bubble strong { font-weight: 700; color: #fff; }
  .msg.student .bubble strong { color: #fff; }
  .bubble em { font-style: italic; color: var(--accent); }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: rgba(139,123,255,0.16); padding: 1px 6px; border-radius: 6px;
    font-family: 'SF Mono', ui-monospace, monospace; font-size: 13.5px;
  }

  /* ---------- Thinking indicator ---------- */
  .thinking { display: flex; gap: 11px; align-items: flex-start; animation: rise .3s ease both; }
  .thinking .avatar { }
  .think-box {
    background: var(--surface); border: 1px solid var(--border);
    border-top-left-radius: 7px; border-radius: var(--radius);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  }
  .think-text {
    font-size: 14px; color: var(--text-dim); font-weight: 500;
    background: linear-gradient(90deg, var(--text-dim) 0%, #fff 50%, var(--text-dim) 100%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: shimmer 1.8s linear infinite;
  }
  @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
  .think-dots { display: inline-flex; gap: 3px; }
  .think-dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
    animation: bob 1.2s infinite both;
  }
  .think-dots i:nth-child(2){ animation-delay: .15s; }
  .think-dots i:nth-child(3){ animation-delay: .3s; }
  @keyframes bob { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-4px);opacity:1} }

  .cursor::after {
    content: '▋'; color: var(--accent-2); animation: blink 1s steps(2) infinite; margin-left: 1px;
  }
  @keyframes blink { 50%{opacity:0} }

  /* ---------- Composer ---------- */
  footer {
    flex-shrink: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
    background: rgba(14,12,29,0.72); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border);
  }
  .composer {
    max-width: var(--maxw); margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    padding: 6px 6px 6px 8px; transition: border-color .18s, box-shadow .18s;
  }
  .composer:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(139,123,255,0.15); }
  textarea {
    flex: 1; resize: none; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 16px; line-height: 1.45; max-height: 130px;
    padding: 9px 6px; outline: none;
  }
  textarea::placeholder { color: var(--text-dim); }
  .send {
    flex-shrink: 0; width: 40px; height: 40px; border: none; border-radius: 50%;
    background: var(--accent-grad); color: #15132B; cursor: pointer;
    display: grid; place-items: center; transition: transform .1s, opacity .18s;
  }
  .send svg { width: 18px; height: 18px; }
  .send:active { transform: scale(.9); }
  .send:disabled { opacity: .4; cursor: default; }
  .disclaimer { max-width: var(--maxw); margin: 9px auto 0; font-size: 11px; color: var(--text-dim); text-align: center; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="logo">S</div>
    <div class="brand">
      <span class="name">Sgela</span>
      <span class="tag">Matric tutor</span>
    </div>
    <span class="status"><span class="pulse"></span>Online</span>
  </header>

  <main id="main">
    <div class="thread" id="thread">
      <div class="greeting" id="greeting">
        <div class="hi">Let's get you to that 80%.</div>
        <p>Your Matric tutor for Maths, Maths Lit, Physical Sciences, Life Sciences and Geography. Ask me a tough concept, a calculation, or practice questions in exam style.</p>
        <div class="chips" id="chips">
          <button class="chip">Explain Newton's Laws simply</button>
          <button class="chip">Help me with calculus optimisation</button>
          <button class="chip">How do I calculate gradient on a map?</button>
          <button class="chip">Practice questions on meiosis</button>
          <button class="chip">Work out compound interest with me</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask Sgela anything…" autocomplete="off"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="disclaimer">Sgela can make mistakes. Always check against your textbook and memo.</div>
  </footer>

<script>
  const thread = document.getElementById("thread");
  const main = document.getElementById("main");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const greeting = document.getElementById("greeting");
  const history = [];

  // rotating "thinking" phrases — feels like it's working through the problem
  const THINKS = [
    "Thinking", "Working through the method", "Checking the CAPS approach",
    "Lining up the steps", "Double-checking the units", "Getting the marks right"
  ];

  function format(text) {
    let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    esc = esc.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    esc = esc.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    esc = esc.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>");
    esc = esc.replace(/_([^_\n]+)_/g, "<em>$1</em>");
    // paragraphs
    return esc.split(/\n{2,}/).map(block => {
      const lines = block.split("\n");
      if (lines.every(l => /^\s*[-•]\s+/.test(l))) {
        return "<ul>" + lines.map(l => "<li>"+l.replace(/^\s*[-•]\s+/,"")+"</li>").join("") + "</ul>";
      }
      if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) {
        return "<ol>" + lines.map(l => "<li>"+l.replace(/^\s*\d+[.)]\s+/,"")+"</li>").join("") + "</ol>";
      }
      return "<p>" + block.replace(/\n/g,"<br>") + "</p>";
    }).join("");
  }

  function addStudent(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg student";
    wrap.innerHTML = `<div class="bubble">${format(text)}</div>`;
    thread.appendChild(wrap); scrollDown();
  }

  function showThinking() {
    const wrap = document.createElement("div");
    wrap.className = "thinking"; wrap.id = "thinking";
    wrap.innerHTML = `<div class="avatar">S</div>
      <div class="think-box">
        <span class="think-text" id="think-text">Thinking</span>
        <span class="think-dots"><i></i><i></i><i></i></span>
      </div>`;
    thread.appendChild(wrap); scrollDown();
    let i = 0;
    const el = () => document.getElementById("think-text");
    wrap._timer = setInterval(() => {
      i = (i + 1) % THINKS.length;
      const t = el(); if (t) t.textContent = THINKS[i];
    }, 1400);
  }
  function stopThinking() {
    const w = document.getElementById("thinking");
    if (w) { clearInterval(w._timer); w.remove(); }
  }

  function addSgelaBubble() {
    const wrap = document.createElement("div");
    wrap.className = "msg sgela";
    wrap.innerHTML = `<div class="avatar">S</div><div class="bubble cursor"></div>`;
    thread.appendChild(wrap);
    return wrap.querySelector(".bubble");
  }

  function scrollDown() { requestAnimationFrame(() => { main.scrollTop = main.scrollHeight; }); }

  async function send(text) {
    text = (text || input.value).trim();
    if (!text) return;
    if (greeting) greeting.remove();
    input.value = ""; input.style.height = "auto"; sendBtn.disabled = true;

    addStudent(text);
    history.push({ role: "user", content: text });
    showThinking();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      if (!res.ok || !res.body) throw new Error("bad response");

      stopThinking();
      const bubble = addSgelaBubble();
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        bubble.innerHTML = format(full);
        bubble.classList.add("cursor");
        scrollDown();
      }
      bubble.classList.remove("cursor");
      bubble.innerHTML = format(full);
      history.push({ role: "assistant", content: full });
    } catch (e) {
      stopThinking();
      const b = addSgelaBubble();
      b.classList.remove("cursor");
      b.innerHTML = format("I couldn't reach the server. Check your connection and try again 🙏");
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  }

  document.getElementById("chips")?.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) send(e.target.textContent);
  });
  sendBtn.addEventListener("click", () => send());
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
