<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sgela AI — Your Matric Tutor</title>
<meta name="description" content="Your personal Grade 12 tutor for Physical Sciences and Life Sciences. Sharp minds, better marks." />

<!-- PWA: lets students add it to their home screen like a real app -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#15132B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sgela AI" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #15132B;
    --chalk: #FBF9F4;
    --highlight: #FFD23F;
    --coral: #FF6B5A;
    --student: #2D2763;
    --muted: #6B6880;
    --line: #ECE8DE;
    --sgela-bubble: #FFFFFF;
    --radius: 26px;
    --maxw: 720px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--chalk);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---- Header ---- */
  header {
    background: linear-gradient(135deg, #1B1838 0%, #15132B 55%, #221B4A 100%);
    color: var(--chalk);
    padding: 16px 20px calc(18px + env(safe-area-inset-top, 0));
    padding-top: calc(16px + env(safe-area-inset-top, 0));
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 20px rgba(21,19,43,0.12);
  }
  .mark {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: 23px;
    letter-spacing: -0.01em;
  }
  .mark .dot { color: var(--highlight); }
  .status {
    margin-left: auto;
    font-size: 12.5px;
    color: #BFBCd4;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #43D17A; display: inline-block;
  }

  /* ---- Thread ---- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .thread {
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- Empty state / greeting ---- */
  .greeting {
    margin: 8vh auto 0;
    max-width: 520px;
    text-align: left;
    padding: 0 4px;
  }
  .greeting h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 7vw, 38px);
    line-height: 1.1;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
  }
  .greeting p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 22px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 11px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .08s, box-shadow .18s;
    font-family: inherit;
  }
  .chip:hover {
    border-color: var(--highlight);
    background: #FFFDF4;
    box-shadow: 0 4px 14px rgba(255,210,63,0.25);
  }
  .chip:active { transform: scale(.96); }

  /* ---- Bubbles ---- */
  .msg { display: flex; }
  .msg.student { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 13px 17px;
    border-radius: var(--radius);
    font-size: 15.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .28s cubic-bezier(.3,1.3,.5,1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.sgela .bubble {
    background: var(--sgela-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 8px;
    color: var(--ink);
    box-shadow: 0 2px 12px rgba(21,19,43,0.05);
  }
  .msg.student .bubble {
    background: linear-gradient(135deg, #332B72 0%, #2D2763 100%);
    color: #fff;
    border-bottom-right-radius: 8px;
    box-shadow: 0 3px 14px rgba(45,39,99,0.25);
  }
  .bubble strong { font-weight: 600; }
  .bubble em { font-style: italic; }

  /* typing dots */
  .typing .bubble { display: inline-flex; gap: 4px; align-items: center; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); opacity: .4;
    animation: blink 1.3s infinite both;
  }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:.9} }

  /* ---- Composer ---- */
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    background: var(--chalk);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0));
  }
  .composer {
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex;
    gap: 9px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 13px 18px;
    font-family: inherit;
    font-size: 16px; /* 16px stops iOS zoom-on-focus */
    line-height: 1.4;
    max-height: 120px;
    background: #fff;
    color: var(--ink);
    transition: border-color .18s, box-shadow .18s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--highlight);
    box-shadow: 0 0 0 4px rgba(255,210,63,0.18);
  }
  .send {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border: none;
    border-radius: 50%;
    background: var(--ink);
    color: var(--highlight);
    font-size: 19px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .1s, box-shadow .18s;
    box-shadow: 0 3px 12px rgba(21,19,43,0.22);
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(21,19,43,0.28); }
  .send:active { transform: scale(.92); }
  .send:disabled { opacity: .4; cursor: default; }

  .disclaimer {
    max-width: var(--maxw);
    margin: 7px auto 0;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <span class="mark">Sgela<span class="dot">.</span></span>
    <span class="status"><span class="pulse"></span>Online</span>
  </header>

  <main id="main">
    <div class="thread" id="thread">
      <div class="greeting" id="greeting">
        <h1>Let's get you to that 80%.</h1>
        <p>I'm your Matric tutor for Physical Sciences and Life Sciences. Ask me anything — a tough concept, a calculation, or practice questions in exam style.</p>
        <div class="chips" id="chips">
          <button class="chip">Explain Newton's Laws simply</button>
          <button class="chip">Help me balance a redox reaction</button>
          <button class="chip">Practice questions on meiosis</button>
          <button class="chip">I don't get electric circuits</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask Sgela a question…" autocomplete="off"></textarea>
      <button class="send" id="send" aria-label="Send">➤</button>
    </div>
    <div class="disclaimer">Sgela can make mistakes. Always check against your textbook and memo.</div>
  </footer>

<script>
  const thread = document.getElementById("thread");
  const main = document.getElementById("main");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const greeting = document.getElementById("greeting");

  // conversation history sent to the server so Sgela remembers the thread
  const history = [];

  // --- minimal, safe WhatsApp/markdown -> HTML for *bold* and _italic_ ---
  function format(text) {
    const esc = text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc
      .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
      .replace(/_([^_\n]+)_/g, "<em>$1</em>");
  }

  function addBubble(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = format(text);
    wrap.appendChild(b);
    thread.appendChild(wrap);
    scrollDown();
    return b;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg sgela typing";
    wrap.id = "typing";
    wrap.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    thread.appendChild(wrap);
    scrollDown();
  }
  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function scrollDown() {
    requestAnimationFrame(() => { main.scrollTop = main.scrollHeight; });
  }

  async function send(text) {
    text = (text || input.value).trim();
    if (!text) return;

    if (greeting) greeting.remove();
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addBubble("student", text);
    history.push({ role: "user", content: text });
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || "…";
      addBubble("sgela", reply);
      history.push({ role: "assistant", content: reply });
    } catch (e) {
      hideTyping();
      addBubble("sgela", "I couldn't reach the server. Check your connection and try again 🙏");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // chip clicks
  document.getElementById("chips")?.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) send(e.target.textContent);
  });

  sendBtn.addEventListener("click", () => send());

  // Enter to send, Shift+Enter for newline
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // auto-grow textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  // register service worker for offline/installable PWA
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
